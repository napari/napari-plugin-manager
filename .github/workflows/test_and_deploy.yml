# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: test and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }}, py${{ matrix.python-version }}, napari ${{ matrix.napari }}, ${{ matrix.tool }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-15]
        python-version: ["3.11", "3.12"]
        napari: ["latest", "repo", '0.6.6']
        tool: ["pip", "conda"]
        include:
          # add 3.13 on ubuntu
          - platform: ubuntu-latest
            napari: repo
            tool: pip
            python-version: "3.13"
          # only run macos intel on py3.12
          - platform: macos-15-intel
            napari: repo
            tool: pip
            python-version: "3.12"
          - platform: macos-15-intel
            napari: repo
            tool: conda
            python-version: "3.12"
        exclude:
        # skip repo install on conda
        - platform: ubuntu-latest
          napari: repo
          tool: conda
        - platform: windows-latest
          napari: repo
        - platform: macos-15-intel
          napari: repo
        - platform: macos-15
          napari: repo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }} - pip
        if: matrix.tool == 'pip'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }} - conda
        if: matrix.tool == 'conda'
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"
          python-version: ${{ matrix.python-version }}

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - name: Install dependencies without tox-conda
        if: matrix.tool == 'pip'
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools tox tox-gh-actions tox-uv

      - name: Install dependencies including tox-conda
        if: matrix.tool == 'conda'
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools 'tox<4' tox-gh-actions tox-conda

      - name: Test with tox - pip
        if: matrix.tool == 'pip'
        run: python -m tox
        env:
          PYVISTA_OFF_SCREEN: True  # required for opengl on windows
          NAPARI: ${{ matrix.napari }}
          TOOL: ${{ matrix.tool }}
          FORCE_COLOR: 1
      - name: Test with tox - conda
        if: matrix.tool == 'conda'
        shell: bash -el {0}
        run: python -m tox
        env:
          PYVISTA_OFF_SCREEN: True  # required for opengl on windows
          NAPARI: ${{ matrix.napari }}
          TOOL: ${{ matrix.tool }}
          FORCE_COLOR: 1


      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage reports ${{ matrix.platform }} py ${{ matrix.python-version }} ${{ matrix.tool }} ${{ matrix.napari }}
          include-hidden-files: true
          path: |
            ./.coverage.*


  upload_coverage:
    if: ${{ always() }}
    secrets: inherit
    needs:
      - test
    uses: napari/shared-workflows/.github/workflows/upload_coverage.yml@main
    with:
      artifact-pattern: 'coverage reports*'


  deploy:
    # this will run when you have tagged a commit, starting with "v*"
    # needs: [test]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools build
      - name: Build
        run: |
          git tag
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
